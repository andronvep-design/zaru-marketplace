    // Main Marketplace App Component
    function ZaruMarketplace() {
      // Global View Mode: 'store' | 'seller' | 'admin'
      const [viewMode, setViewMode] = useState("store");

      // Store Tab Navigation: 'home' | 'catalog' | 'wishlist' | 'account'
      const [currentTab, setCurrentTab] = useState("home");
      
      // Products & Filters State
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("Все");
      const [selectedProduct, setSelectedProduct] = useState(null);

      // Location / Pickup Point Selection
      const [selectedLocation, setSelectedLocation] = useState(PICKUP_POINTS[0]);

      // User lists state
      const [cart, setCart] = useState([]);
      const [favorites, setFavorites] = useState([]);
      const [orders, setOrders] = useState([
        {
          id: "ZR-849201",
          date: "24 Октября 2026",
          items: [
            { id: 1, title: "Беспроводные наушники ZARU SoundPro Max ANC", price: 4990, quantity: 1, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" }
          ],
          total: 4990,
          address: "Тирасполь, ул. 25 Октября, 42",
          status: "В пути",
          step: 2 // 1: Оформлен, 2: В пути, 3: Доставлен в ПВЗ
        }
      ]);
      
      // Authentication & User Profile State
      const [currentUser, setCurrentUser] = useState(DEMO_USER); // DEMO_USER or null
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authTab, setAuthTab] = useState("login"); // login | register
      const [authForm, setAuthForm] = useState({
        name: "",
        email: "",
        phone: "",
        password: "",
        role: "buyer"
      });
      const [profileTab, setProfileTab] = useState("orders"); // orders | profile | addresses | cards | settings
      const [isUserMenuOpen, setIsUserMenuOpen] = useState(false);

      // New Address & Card state forms inside profile
      const [newAddressInput, setNewAddressInput] = useState("");
      const [newCardInput, setNewCardInput] = useState({ number: "", expiry: "" });

      // Modals & Sliders
      const [isCartDrawerOpen, setIsCartDrawerOpen] = useState(false);
      const [currentSlide, setCurrentSlide] = useState(0);
      const [toastMessage, setToastMessage] = useState(null);

      // Seller State
      const [newProductForm, setNewProductForm] = useState({
        title: "",
        category: "Электроника",
        price: "",
        oldPrice: "",
        stock: "",
        image: "",
        description: ""
      });

      // Admin State
      const [commissionRate, setCommissionRate] = useState(12);

      // Toast Notification Helper
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Banner Auto Slider
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentSlide((prev) => (prev + 1) % HERO_SLIDES.length);
        }, 6000);
        return () => clearInterval(timer);
      }, []);

      // Filtered Products
      const filteredProducts = products.filter((item) => {
        const matchesCategory = selectedCategory === "Все" || item.category === selectedCategory;
        const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              item.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch && item.status === "approved";
      });

      // Cart Calculations
      const cartTotalPrice = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const cartTotalCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      // Cart Actions
      const addToCart = (product, e) => {
        if (e) e.stopPropagation();
        setCart((prevCart) => {
          const existing = prevCart.find((item) => item.id === product.id);
          if (existing) {
            return prevCart.map((item) =>
              item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
            );
          }
          return [...prevCart, { ...product, quantity: 1 }];
        });
        showToast(`Товар "${product.title.slice(0, 20)}..." добавлен в корзину`);
      };

      const updateCartQuantity = (id, delta) => {
        setCart((prevCart) =>
          prevCart
            .map((item) => {
              if (item.id === id) {
                const newQty = item.quantity + delta;
                return newQty > 0 ? { ...item, quantity: newQty } : null;
              }
              return item;
            })
            .filter(Boolean)
        );
      };

      // Favorites Action
      const toggleFavorite = (product, e) => {
        if (e) e.stopPropagation();
        if (favorites.some((item) => item.id === product.id)) {
          setFavorites(favorites.filter((item) => item.id !== product.id));
          showToast("Удалено из избранного");
        } else {
          setFavorites([...favorites, product]);
          showToast("Добавлено в избранное");
        }
      };

      // User Auth Handlers
      const handleLogin = (e) => {
        e.preventDefault();
        if (!authForm.email || !authForm.password) {
          showToast("Введите Email и Пароль");
          return;
        }
        setCurrentUser({
          ...DEMO_USER,
          email: authForm.email,
          name: authForm.email.split('@')[0]
        });
        setIsAuthModalOpen(false);
        showToast("Добро пожаловать в ZARU!");
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (!authForm.name || !authForm.email || !authForm.password) {
          showToast("Заполните все обязательные поля");
          return;
        }
        const newUser = {
          name: authForm.name,
          email: authForm.email,
          phone: authForm.phone || "+7 (900) 000-00-00",
          role: authForm.role,
          status: "ZARU Club Newbie",
          bonusPoints: 300,
          addresses: [PICKUP_POINTS[0]],
          cards: [],
          notifications: { email: true, sms: true, promo: true }
        };
        setCurrentUser(newUser);
        setIsAuthModalOpen(false);
        showToast("Регистрация успешна! Вам начислено 300 бонусов.");
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setIsUserMenuOpen(false);
        setCurrentTab("home");
        showToast("Вы вышли из аккаунта ZARU");
      };

      const handleAddAddress = () => {
        if (!newAddressInput.trim()) return;
        setCurrentUser(prev => ({
          ...prev,
          addresses: [...(prev.addresses || []), newAddressInput.trim()]
        }));
        setNewAddressInput("");
        showToast("Новый адрес ПВЗ добавлен");
      };

      const handleAddCard = () => {
        if (!newCardInput.number || !newCardInput.expiry) return;
        const newCard = {
          id: Date.now(),
          type: "MIR / Visa ZARU",
          number: "•••• " + newCardInput.number.slice(-4),
          expiry: newCardInput.expiry
        };
        setCurrentUser(prev => ({
          ...prev,
          cards: [...(prev.cards || []), newCard]
        }));
        setNewCardInput({ number: "", expiry: "" });
        showToast("Карта привязана к ZARU Pay");
      };

      // Checkout Handler
      const handleCheckout = () => {
        if (cart.length === 0) return;
        if (!currentUser) {
          setIsAuthModalOpen(true);
          showToast("Пожалуйста, войдите в аккаунт для оформления");
          return;
        }
        const newOrder = {
          id: "ZR-" + Math.floor(100000 + Math.random() * 900000),
          date: new Date().toLocaleDateString("ru-RU", { day: 'numeric', month: 'long', year: 'numeric' }),
          items: [...cart],
          total: cartTotalPrice,
          address: selectedLocation,
          status: "В обработке",
          step: 1
        };
        setOrders([newOrder, ...orders]);
        setCart([]);
        setIsCartDrawerOpen(false);
        setCurrentTab("account");
        setProfileTab("orders");
        showToast(`Заказ ${newOrder.id} успешно оформлен!`);
      };

      // Add Product Handler (Seller Studio)
      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!newProductForm.title || !newProductForm.price) {
          showToast("Заполните название и цену товара");
          return;
        }
        const newProd = {
          id: Date.now(),
          title: newProductForm.title,
          category: newProductForm.category,
          price: Number(newProductForm.price),
          oldPrice: newProductForm.oldPrice ? Number(newProductForm.oldPrice) : Number(newProductForm.price) * 1.3,
          rating: 5.0,
          reviewsCount: 1,
          seller: currentUser?.name || "Новый Продавец",
          stock: Number(newProductForm.stock) || 10,
          status: "pending",
          isNew: true,
          image: newProductForm.image || "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80",
          description: newProductForm.description || "Описание товара..."
        };
        setProducts([newProd, ...products]);
        setNewProductForm({ title: "", category: "Электроника", price: "", oldPrice: "", stock: "", image: "", description: "" });
        showToast("Товар отправлен на модерацию ZARU!");
      };

      // Admin Action: Approve / Reject
      const handleModeration = (id, newStatus) => {
        setProducts(products.map(p => p.id === id ? { ...p, status: newStatus } : p));
        showToast(newStatus === "approved" ? "Товар одобрен и опубликован!" : "Товар отклонен");
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">

          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white font-bold text-xs px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-purple-500/30 animate-bounce">

            </div>

          {/* TOP GLOBAL SWITCHER BANNER */}
          <div className="bg-slate-950 text-slate-300 text-xs py-2 px-4 border-b border-purple-900/30 flex justify-between items-center flex-wrap gap-2">
            <div className="flex items-center gap-2 font-medium">
              <span className="bg-purple-600 text-white font-black text-[10px] px-2 py-0.5 rounded-full uppercase tracking-widest">ECOSYSTEM</span>
              <span className="hidden sm:inline">Переключение рабочих режимов платформы ZARU:</span>
            </div>
            
            <div className="flex items-center gap-1">

                onClick={() => setViewMode("store")}
                className={`px-3 py-1 rounded-xl text-xs font-bold transition ${
                  viewMode === "store" ? "bg-purple-700 text-white shadow" : "hover:bg-slate-800 text-slate-400"

              <button

                }`}
              >
                🏪 ZARU Seller (Продавец)
              </button>
              <button
                onClick={() => setViewMode("admin")}
                className={`px-3 py-1 rounded-xl text-xs font-bold transition ${
                  viewMode === "admin" ? "bg-purple-700 text-white shadow" : "hover:bg-slate-800 text-slate-400"
                }`}

              </button>

                  <span className="font-bold text-white">ПВЗ:</span>
                  <select
                    value={selectedLocation}
                    onChange={(e) => setSelectedLocation(e.target.value)}
                    className="bg-transparent text-purple-100 font-medium focus:outline-none cursor-pointer"
                  >
                    {PICKUP_POINTS.map((pt, idx) => (
                      <option key={idx} value={pt} className="bg-purple-950 text-white">{pt}</option>
                    ))}
                  </select>
                </div>

                <span className="hidden md:inline text-purple-300">Бесплатная доставка до ПВЗ от 1000 ₽</span>
              </div>

              <div className="flex items-center gap-4 font-semibold">
                <a href="#sellers" onClick={() => setViewMode("seller")} className="hover:text-amber-300 transition">Продавайте на ZARU</a>
                <a href="#pvz" onClick={() => showToast("Открытие франшизы ПВЗ ZARU: +7 (999) 000-11-22")} className="hidden sm:inline hover:text-amber-300 transition">Открыть ПВЗ</a>
                <a href="#help" onClick={() => showToast("Служба поддержки 24/7: support@zaru.ru")} className="hover:text-amber-300 transition">Поддержка</a>
              </div>
            </div>

            {/* Main Search & Navigation Bar */}
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
              
              {/* Logo */}
              <div 
                onClick={() => { setViewMode("store"); setCurrentTab("home"); setSelectedCategory("Все"); }} 
                className="cursor-pointer flex items-center gap-2 group"
              >
                <div className="w-10 h-10 bg-gradient-to-tr from-amber-400 via-amber-300 to-yellow-500 rounded-2xl flex items-center justify-center font-black text-slate-950 text-2xl tracking-tighter shadow-lg group-hover:scale-105 transition">
                  Z
                </div>
                <div className="flex flex-col">
                  <span className="text-2xl font-black tracking-wider leading-none text-white font-mono">ZARU<span className="text-amber-400">.</span></span>
                  <span className="text-[9px] uppercase tracking-widest text-purple-300 font-bold">Marketplace</span>
                </div>
              </div>

              {/* Search Bar */}
              {viewMode === "store" && (
                <div className="flex-1 max-w-2xl relative hidden sm:block">
                  <div className="relative flex items-center">
                    <input
                      type="text"
                      placeholder="Искать на ZARU (например, наушники, кроссовки...)"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-purple-900/50 text-white placeholder-purple-300 text-xs font-semibold px-4 py-3 rounded-2xl pl-11 pr-24 border border-purple-800/80 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-purple-900 transition"
                    />
                    <Icon name="search" className="w-4 h-4 text-purple-300 absolute left-4" />

                    <span className="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-0.5 rounded-full">{cartTotalCount}</span>
                  </div>
                  <button onClick={() => setIsCartDrawerOpen(false)} className="p-2 hover:bg-slate-100 rounded-full">
                    <Icon name="x" className="w-5 h-5 text-slate-500" />
                  </button>
                </div>

                {/* Items List */}
                <div className="flex-1 overflow-y-auto py-4 space-y-4">
                  {cart.length === 0 ? (
                    <div className="text-center py-16 text-slate-400">
                      <Icon name="shopping-bag" className="w-16 h-16 mx-auto mb-3 opacity-20" />
                      <p className="font-bold text-slate-600">Ваша корзина пока пуста</p>
                      <span className="text-xs text-slate-400 block mt-1">Добавьте понравившиеся товары из каталога</span>
                    </div>
                  ) : (
                    cart.map((item) => (
                      <div key={item.id} className="flex gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-200 items-center">
                        <img src={item.image} className="w-16 h-16 object-cover rounded-xl" />
                        <div className="flex-1">
                          <h4 className="text-xs font-bold text-slate-800 line-clamp-1">{item.title}</h4>
                          <span className="text-xs font-black text-purple-900 block mt-1">{item.price.toLocaleString("ru-RU")} ₽</span>
                          
                          {/* Quantity Counter */}
                          <div className="flex items-center gap-3 mt-2">
                            <div className="flex items-center bg-white rounded-lg border border-slate-200">
                              <button onClick={() => updateCartQuantity(item.id, -1)} className="px-2 py-0.5 font-bold hover:bg-slate-100">-</button>
                              <span className="px-2 text-xs font-black">{item.quantity}</span>
                              <button onClick={() => updateCartQuantity(item.id, 1)} className="px-2 py-0.5 font-bold hover:bg-slate-100">+</button>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {/* Footer Checkout */}
                {cart.length > 0 && (
                  <div className="pt-4 border-t border-slate-200 space-y-3">
                    <div className="flex justify-between items-center text-xs text-slate-500">
                      <span>Пункт выдачи (ПВЗ):</span>
                      <span className="font-bold text-slate-800 line-clamp-1 max-w-[200px]">{selectedLocation}</span>
                    </div>
                    <div className="flex justify-between items-center text-slate-900 font-black text-lg">
                      <span>Итого к оплате:</span>
                      <span className="text-purple-900">{cartTotalPrice.toLocaleString("ru-RU")} ₽</span>
                    </div>
                    <button
                      onClick={handleCheckout}
                      className="w-full bg-gradient-to-r from-purple-700 via-indigo-700 to-purple-900 text-white font-black py-4 rounded-2xl shadow-xl hover:brightness-110 transition text-xs uppercase tracking-wider"
                    >
                      Оформить заказ в ZARU
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* AUTHENTICATION MODAL (LOGIN & REGISTRATION) */}
          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative border border-slate-100">
                <button
                  onClick={() => setIsAuthModalOpen(false)}
                  className="absolute top-4 right-4 p-2 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 transition"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                {/* Auth Mode Toggle */}
                <div className="flex bg-slate-100 p-1 rounded-2xl mb-6">
                  <button
                    onClick={() => setAuthTab("login")}
                    className={`flex-1 py-2.5 text-xs font-black rounded-xl transition ${
                      authTab === "login" ? "bg-purple-700 text-white shadow-md" : "text-slate-600"
                    }`}
                  >
                    Вход в аккаунт
                  </button>
                  <button
                    onClick={() => setAuthTab("register")}
                    className={`flex-1 py-2.5 text-xs font-black rounded-xl transition ${
                      authTab === "register" ? "bg-purple-700 text-white shadow-md" : "text-slate-600"
                    }`}
                  >
                    Регистрация
                  </button>
                </div>

                {/* LOGIN FORM */}
                {authTab === "login" && (
                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Email или Номер телефона</label>
                      <input
                        type="email"
                        placeholder="alex@zaru.ru"
                        value={authForm.email}
                        onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs font-bold focus:ring-2 focus:ring-purple-500"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Пароль</label>
                      <input
                        type="password"
                        placeholder="••••••••"
                        value={authForm.password}
                        onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs font-bold focus:ring-2 focus:ring-purple-500"
                        required
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-800 hover:to-indigo-800 text-white font-black py-3 rounded-xl shadow-lg transition text-xs uppercase tracking-wider"
                    >
                      Войти в ZARU
                    </button>

                    {/* Demo Fast Login Preset */}
                    <button
                      type="button"
                      onClick={() => {
                        setCurrentUser(DEMO_USER);
                        setIsAuthModalOpen(false);
                        showToast("Вы вошли под тестовым аккаунтом!");
                      }}
                      className="w-full bg-amber-100 text-amber-900 font-bold py-2.5 rounded-xl text-xs border border-amber-200 hover:bg-amber-200 transition"
                    >
                      Быстрый демо-вход (Александр)
                    </button>
                  </form>
                )}

                {/* REGISTRATION FORM */}
                {authTab === "register" && (
                  <form onSubmit={handleRegister} className="space-y-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">ФИО *</label>
                      <input
                        type="text"
                        placeholder="Иванов Иван Иванович"
                        value={authForm.name}
                        onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold focus:ring-2 focus:ring-purple-500"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Email *</label>
                      <input
                        type="email"
                        placeholder="user@zaru.ru"
                        value={authForm.email}
                        onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold focus:ring-2 focus:ring-purple-500"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Телефон</label>
                      <input
                        type="text"
                        placeholder="+7 (900) 123-45-67"
                        value={authForm.phone}
                        onChange={(e) => setAuthForm({ ...authForm, phone: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold focus:ring-2 focus:ring-purple-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Пароль *</label>
                      <input
                        type="password"
                        placeholder="••••••••"
                        value={authForm.password}
                        onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold focus:ring-2 focus:ring-purple-500"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Тип аккаунта</label>
                      <select
                        value={authForm.role}
                        onChange={(e) => setAuthForm({ ...authForm, role: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold"
                      >
                        <option value="buyer">Покупатель</option>
                        <option value="seller">Продавец (Селлер ZARU)</option>
                      </select>
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-800 hover:to-indigo-800 text-white font-black py-3 rounded-xl shadow-lg transition text-xs uppercase tracking-wider mt-2"
                    >
                      Зарегистрироваться
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-950 text-slate-400 py-12 border-t border-slate-800 text-xs">
            <div className="max-w-7xl mx-auto px-4 grid grid-cols-2 md:grid-cols-4 gap-8 mb-8">
              <div>
                <h4 className="text-white font-black text-sm mb-3">Покупателям</h4>
                <ul className="space-y-2">
                  <li><a href="#" className="hover:text-white">Как сделать заказ</a></li>
                  <li><a href="#" className="hover:text-white">Способы оплаты</a></li>
                  <li><a href="#" className="hover:text-white">Доставка в ПВЗ</a></li>
                  <li><a href="#" className="hover:text-white">Возврат товара</a></li>
                </ul>
              </div>
              <div>
                <h4 className="text-white font-black text-sm mb-3">Партнерам</h4>
                <ul className="space-y-2">
                  <li><a href="#" onClick={() => setViewMode("seller")} className="hover:text-white">Продавайте на ZARU</a></li>
                  <li><a href="#" className="hover:text-white">Открыть пункт выдачи</a></li>
                  <li><a href="#" className="hover:text-white">Личный кабинет продавца</a></li>
                </ul>
              </div>
              <div>
                <h4 className="text-white font-black text-sm mb-3">Компания ZARU</h4>
                <ul className="space-y-2">
                  <li><a href="#" className="hover:text-white">О нас</a></li>
                  <li><a href="#" className="hover:text-white">Пресс-центр</a></li>
                  <li><a href="#" className="hover:text-white">Контакты и реквизиты</a></li>
                </ul>
              </div>
              <div>
                <h4 className="text-white font-black text-sm mb-3">Мы в соцсетях</h4>
                <div className="flex gap-3">
                  <div className="w-8 h-8 bg-slate-800 rounded-xl flex items-center justify-center text-white cursor-pointer hover:bg-purple-700">Telegram</div>
                  <div className="w-8 h-8 bg-slate-800 rounded-xl flex items-center justify-center text-white cursor-pointer hover:bg-purple-700">VK</div>
                </div>
              </div>
            </div>
            <div className="max-w-7xl mx-auto px-4 border-t border-slate-900 pt-6 text-center text-slate-500 text-[11px]">
              © 2026 ZARU Marketplace. Все права защищены.
            </div>
          </footer>

        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ZaruMarketplace />);
  </script>
</body>
</html>
